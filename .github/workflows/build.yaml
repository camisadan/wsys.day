name: Build and publish beta

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install optimisation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            optipng \
            jpegoptim \
            gifsicle \
            rsync \
            zip \
            unzip

          npm install --global \
            html-minifier-terser \
            clean-css-cli \
            terser

      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='*.log' \
            ./ dist/

          if ! find dist -type f -print -quit | grep -q .; then
            echo "::error::Build directory is empty."
            exit 1
          fi

      - name: Minify HTML
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r -d '' file; do
            tmp="${file}.min.html"

            echo "Minifying HTML: $file"

            if html-minifier-terser \
              --collapse-whitespace \
              --conservative-collapse \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css \
              --minify-js \
              "$file" \
              -o "$tmp" &&
              [ -s "$tmp" ]; then
              mv "$tmp" "$file"
            else
              echo "::warning file=$file::HTML minification failed; keeping original."
              rm -f "$tmp"
            fi
          done < <(find dist -type f -iname '*.html' -print0)

      - name: Minify CSS
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r -d '' file; do
            tmp="${file}.min.css"

            echo "Minifying CSS: $file"

            if cleancss -o "$tmp" "$file" && [ -s "$tmp" ]; then
              mv "$tmp" "$file"
            else
              echo "::warning file=$file::CSS minification failed; keeping original."
              rm -f "$tmp"
            fi
          done < <(find dist -type f -iname '*.css' -print0)

      - name: Minify JavaScript
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r -d '' file; do
            tmp="${file}.min.js"

            echo "Minifying JavaScript: $file"

            if terser "$file" \
              --compress \
              --mangle \
              --comments false \
              -o "$tmp" &&
              [ -s "$tmp" ]; then
              mv "$tmp" "$file"
            else
              echo "::warning file=$file::JavaScript minification failed; keeping original."
              rm -f "$tmp"
            fi
          done < <(
            find dist -type f \
              \( -iname '*.js' -o -iname '*.mjs' \) \
              ! -iname '*.min.js' \
              -print0
          )

      - name: Losslessly optimise PNG images
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r -d '' file; do
            tmp="${file}.optimising.png"

            echo "Optimising PNG: $file"

            if cp -p "$file" "$tmp" &&
              optipng -o7 -quiet "$tmp" &&
              [ -s "$tmp" ]; then
              mv "$tmp" "$file"
            else
              echo "::warning file=$file::PNG optimisation failed; keeping original."
              rm -f "$tmp"
            fi
          done < <(find dist -type f -iname '*.png' -print0)

      - name: Optimise JPEG images
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r -d '' file; do
            tmp="${file}.optimising.jpg"

            echo "Optimising JPEG: $file"

            if cp -p "$file" "$tmp" &&
              jpegoptim \
                --strip-all \
                --all-progressive \
                --max=100 \
                --quiet \
                "$tmp" &&
              [ -s "$tmp" ]; then
              mv "$tmp" "$file"
            else
              echo "::warning file=$file::JPEG optimisation failed; keeping original."
              rm -f "$tmp"
            fi
          done < <(
            find dist -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' \) \
              -print0
          )

      - name: Optimise GIF images
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r -d '' file; do
            tmp="${file}.optimising.gif"

            echo "Optimising GIF: $file"

            if cp -p "$file" "$tmp" &&
              gifsicle --optimize=3 "$tmp" -o "$tmp.optimized" &&
              [ -s "$tmp.optimized" ]; then
              mv "$tmp.optimized" "$file"
              rm -f "$tmp"
            else
              echo "::warning file=$file::GIF optimisation failed; keeping original."
              rm -f "$tmp" "$tmp.optimized"
            fi
          done < <(find dist -type f -iname '*.gif' -print0)

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail

          if ! find dist -type f -print -quit | grep -q .; then
            echo "::error::Build output contains no files."
            exit 1
          fi

          if find dist -type f \
            \( -name '*.min.html' \
            -o -name '*.min.css' \
            -o -name '*.min.js' \
            -o -name '*.optimising.*' \
            -o -name '*.optimized' \) \
            -print -quit | grep -q .; then
            echo "::error::Temporary optimisation files remain in the build."
            exit 1
          fi

          echo "Build file count:"
          find dist -type f | wc -l

          echo "Build size:"
          du -sh dist

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail

          rm -f site-beta.zip

          (
            cd dist
            zip -q -r -9 ../site-beta.zip .
          )

          if [ ! -s site-beta.zip ]; then
            echo "::error::Release archive is missing or empty."
            exit 1
          fi

          zip -T site-beta.zip

          if ! unzip -Z1 site-beta.zip | grep -q .; then
            echo "::error::Release archive contains no entries."
            exit 1
          fi

          echo "Archive entry count:"
          unzip -Z1 site-beta.zip | wc -l

          echo "Archive contents:"
          unzip -l site-beta.zip

      - name: Generate beta version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.0.0-beta.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "${{ steps.version.outputs.tag }}" \
            site-beta.zip \
            --prerelease \
            --title "Beta ${{ steps.version.outputs.version }}" \
            --generate-notes